name: Create ID Map

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:

  # ==========================================================
  # 16 PARALLEL CHUNK JOBS
  # ==========================================================

  extract:
    name: Chunk ${{ matrix.chunk }}

    runs-on: ubuntu-latest

    timeout-minutes: 180

    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        chunk:
          - "00"
          - "01"
          - "02"
          - "03"
          - "04"
          - "05"
          - "06"
          - "07"
          - "08"
          - "09"
          - "10"
          - "11"
          - "12"
          - "13"
          - "14"
          - "15"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          mkdir -p source-json
          mkdir -p output

      # ======================================================
      # LOCATE THIS CHUNK
      # ======================================================

      - name: Locate release chunk
        env:
          GH_TOKEN: ${{ github.token }}
          CHUNK: ${{ matrix.chunk }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/city-data-v1" \
            > release.json

          python3 <<'PY'
          import json
          import os

          chunk = os.environ["CHUNK"]

          with open("release.json", encoding="utf-8") as f:
              release = json.load(f)

          assets = [
              a for a in release.get("assets", [])
              if a["name"].endswith(".enc")
          ]

          # The chunk assets we created contain their 00..15
          # chunk number in the filename.
          candidates = []

          for asset in assets:
              name = asset["name"]

              patterns = [
                  f"-{chunk}.",
                  f"_{chunk}.",
                  f"--{chunk}.",
                  f"chunk-{chunk}",
                  f"chunk_{chunk}",
                  f"chunk--{chunk}",
              ]

              if any(p in name for p in patterns):
                  candidates.append(asset)

          if len(candidates) != 1:
              print("Encrypted release assets:")
              for a in assets:
                  print(" ", a["name"])

              raise SystemExit(
                  f"Expected exactly one asset for chunk {chunk}; "
                  f"found {len(candidates)}"
              )

          asset = candidates[0]

          with open("asset-url.txt", "w") as f:
              f.write(asset["url"])

          with open("asset-name.txt", "w") as f:
              f.write(asset["name"])

          print(
              f"Chunk {chunk}: {asset['name']}"
          )
          PY

      # ======================================================
      # DOWNLOAD ONLY THIS CHUNK
      # ======================================================

      - name: Download chunk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="$(cat asset-url.txt)"
          NAME="$(cat asset-name.txt)"

          echo "Downloading $NAME"

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$URL" \
            -o source.enc

      # ======================================================
      # DECRYPT ONLY THIS CHUNK
      # ======================================================

      - name: Decrypt chunk
        env:
          CITY_DATA_KEY: ${{ secrets.CITY_DATA_KEY }}
        run: |
          set -euo pipefail

          test -n "${CITY_DATA_KEY:-}"

          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -md sha256 \
            -in source.enc \
            -out source.tar.gz \
            -pass env:CITY_DATA_KEY

          tar -xzf source.tar.gz -C source-json

          echo
          echo "Recovered JSON files:"
          find source-json -type f -iname '*.json' | wc -l

      # ======================================================
      # BUILD CHUNK MAP
      #
      # IMPORTANT:
      # We cannot assign the 4-digit file number from the
      # position INSIDE THE CHUNK because chunks were balanced
      # across runners rather than being contiguous source-file
      # ranges.
      #
      # Therefore reconstruct the GLOBAL source-file ordering
      # from chunks-manifest.json.
      # ======================================================

      - name: Download chunk manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/city-data-v1" \
            > manifest-release.json

          python3 <<'PY'
          import json

          with open("manifest-release.json") as f:
              release = json.load(f)

          matches = [
              a for a in release.get("assets", [])
              if a["name"] == "chunks-manifest.json"
          ]

          if len(matches) != 1:
              raise SystemExit(
                  "chunks-manifest.json release asset not found"
              )

          with open("manifest-url.txt", "w") as f:
              f.write(matches[0]["url"])
          PY

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$(cat manifest-url.txt)" \
            -o chunks-manifest.json

      # ======================================================
      # EXTRACT
      # ======================================================

      - name: Create chunk ID map
        env:
          CHUNK: ${{ matrix.chunk }}
        run: |
          cat > /tmp/create-chunk-map.py <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          ROOT = Path("source-json")
          CHUNK = os.environ["CHUNK"]

          OUTPUT = Path(
              f"output/id-map-{CHUNK}.json"
          )

          SUMMARY = Path(
              f"output/id-map-{CHUNK}-summary.json"
          )

          # --------------------------------------------------
          # Normalize field names
          # --------------------------------------------------

          def norm(value):
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value or "").lower()
              )

          NAME_KEYS = {
              "name",
              "businessname",
              "companyname",
              "company",
              "business",
              "title"
          }

          # --------------------------------------------------
          # Business name
          # --------------------------------------------------

          def get_name(row):

              if not isinstance(row, dict):
                  return None

              for key, value in row.items():

                  if norm(key) not in NAME_KEYS:
                      continue

                  if (
                      isinstance(value, str)
                      and value.strip()
                  ):
                      return value.strip()

              return None

          # --------------------------------------------------
          # Convert source structure to records
          # --------------------------------------------------

          def rows_from_json(data):

              if isinstance(data, list):

                  # Matrix source
                  if (
                      len(data) >= 2
                      and isinstance(data[0], list)
                  ):

                      headers = [
                          str(v or "")
                          for v in data[0]
                      ]

                      rows = []

                      for values in data[1:]:

                          if not isinstance(values, list):
                              rows.append(values)
                              continue

                          row = {}

                          for i, header in enumerate(headers):
                              row[header] = (
                                  values[i]
                                  if i < len(values)
                                  else None
                              )

                          rows.append(row)

                      return rows

                  return data

              if isinstance(data, dict):

                  for key in (
                      "rows",
                      "data",
                      "records",
                      "results",
                      "items",
                      "businesses"
                  ):

                      if isinstance(data.get(key), list):
                          return rows_from_json(data[key])

                  values = list(data.values())

                  if (
                      values
                      and all(
                          isinstance(v, dict)
                          for v in values
                      )
                  ):
                      return values

              return []

          # --------------------------------------------------
          # Read manifest
          # --------------------------------------------------

          with open(
              "chunks-manifest.json",
              encoding="utf-8"
          ) as f:
              manifest = json.load(f)

          # --------------------------------------------------
          # Discover ALL source filenames from manifest.
          #
          # Manifest format may be object/list based, so walk
          # it recursively and collect JSON filenames.
          # --------------------------------------------------

          manifest_json_names = set()

          def walk_manifest(value):

              if isinstance(value, dict):

                  for k, v in value.items():

                      if (
                          isinstance(k, str)
                          and k.lower().endswith(".json")
                      ):
                          manifest_json_names.add(
                              Path(k).name
                          )

                      walk_manifest(v)

              elif isinstance(value, list):

                  for item in value:
                      walk_manifest(item)

              elif isinstance(value, str):

                  if value.lower().endswith(".json"):
                      manifest_json_names.add(
                          Path(value).name
                      )

          walk_manifest(manifest)

          # If manifest contains the source filenames,
          # this recreates the same global alphabetical
          # enumeration rule used by make-file-ids.js.

          global_files = sorted(
              manifest_json_names,
              key=lambda x: x
          )

          if not global_files:
              raise SystemExit(
                  "Could not recover source filenames "
                  "from chunks-manifest.json"
              )

          file_ids = {
              filename:
                  str(i + 1).zfill(4)
              for i, filename
              in enumerate(global_files)
          }

          print(
              "Global source filenames:",
              len(global_files)
          )

          # --------------------------------------------------
          # Files physically contained in this chunk
          # --------------------------------------------------

          files = sorted(
              ROOT.rglob("*.json"),
              key=lambda p: p.name
          )

          print(
              f"Chunk {CHUNK} source files:",
              len(files)
          )

          result = {}

          total_rows = 0
          mapped = 0
          unnamed = 0

          file_summary = []

          # --------------------------------------------------
          # Process
          # --------------------------------------------------

          for file in files:

              filename = file.name

              if filename not in file_ids:
                  raise SystemExit(
                      "Source file missing from global "
                      f"manifest enumeration: {filename}"
                  )

              file_id = file_ids[filename]

              print(
                  f"[{file_id}] {filename}"
              )

              with open(
                  file,
                  encoding="utf-8"
              ) as f:
                  data = json.load(f)

              rows = rows_from_json(data)

              file_mapped = 0
              file_unnamed = 0

              for row_index, row in enumerate(
                  rows,
                  start=1
              ):

                  identity = (
                      f"{file_id}-"
                      f"{row_index:06d}"
                  )

                  name = get_name(row)

                  total_rows += 1

                  if name:

                      result[identity] = name

                      mapped += 1
                      file_mapped += 1

                  else:

                      unnamed += 1
                      file_unnamed += 1

              file_summary.append({
                  "file_id": file_id,
                  "filename": filename,
                  "rows": len(rows),
                  "mapped": file_mapped,
                  "unnamed": file_unnamed
              })

          # --------------------------------------------------
          # Save
          # --------------------------------------------------

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False
              )

          with open(
              SUMMARY,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  {
                      "chunk": CHUNK,
                      "files": len(files),
                      "rows": total_rows,
                      "mapped": mapped,
                      "unnamed": unnamed,
                      "file_details": file_summary
                  },
                  f,
                  indent=2
              )

          print("")
          print("============================")
          print(f"CHUNK {CHUNK} COMPLETE")
          print("============================")
          print("Files:  ", len(files))
          print("Rows:   ", total_rows)
          print("Mapped: ", mapped)
          print("Unnamed:", unnamed)
          PY

          python3 /tmp/create-chunk-map.py

      # ======================================================
      # UPLOAD SHARD
      # ======================================================

      - name: Upload chunk artifact
        uses: actions/upload-artifact@v4
        with:
          name: id-map-${{ matrix.chunk }}
          path: output/
          if-no-files-found: error
          retention-days: 90


  # ==========================================================
  # MERGE
  # ==========================================================

  merge:
    name: Merge ID Map

    needs:
      - extract

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Download all chunk artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: id-map-*
          path: shards

      - name: Inspect shards
        run: |
          find shards -type f | sort

      - name: Merge
        run: |
          mkdir -p final

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          shard_files = sorted(
              Path("shards").rglob("id-map-??.json")
          )

          if len(shard_files) != 16:
              raise SystemExit(
                  f"Expected 16 map shards; "
                  f"found {len(shard_files)}"
              )

          final = {}

          duplicate_ids = []

          for shard in shard_files:

              print("Merging", shard)

              with open(
                  shard,
                  encoding="utf-8"
              ) as f:
                  data = json.load(f)

              for identity, name in data.items():

                  if identity in final:

                      duplicate_ids.append(
                          identity
                      )

                      continue

                  final[identity] = name

          if duplicate_ids:

              raise SystemExit(
                  "Duplicate IDs detected: "
                  + repr(duplicate_ids[:20])
              )

          pattern = re.compile(
              r"^\d{4}-\d{6}$"
          )

          invalid = [
              identity
              for identity in final
              if not pattern.fullmatch(identity)
          ]

          if invalid:

              raise SystemExit(
                  "Invalid ID format: "
                  + repr(invalid[:20])
              )

          # Deterministic ID ordering

          final = dict(
              sorted(final.items())
          )

          with open(
              "final/id-map.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  final,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          summaries = []

          for summary_file in sorted(
              Path("shards").rglob(
                  "id-map-??-summary.json"
              )
          ):

              with open(
                  summary_file,
                  encoding="utf-8"
              ) as f:

                  summaries.append(
                      json.load(f)
                  )

          summary = {
              "chunks": len(shard_files),
              "source_files": sum(
                  s["files"]
                  for s in summaries
              ),
              "total_rows": sum(
                  s["rows"]
                  for s in summaries
              ),
              "mapped_ids": len(final),
              "unnamed_rows": sum(
                  s["unnamed"]
                  for s in summaries
              ),
              "duplicate_ids": 0,
              "id_format": "FFFF-RRRRRR"
          }

          with open(
              "final/id-map-summary.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  summary,
                  f,
                  indent=2
              )

          print("")
          print("==============================")
          print("FINAL ID MAP")
          print("==============================")

          for key, value in summary.items():
              print(f"{key}: {value}")

          print("")
          print("First 10:")

          for identity in list(final)[:10]:
              print(
                  identity,
                  "=>",
                  final[identity]
              )
          PY

      - name: Upload final ID map
        uses: actions/upload-artifact@v4
        with:
          name: id-map
          path: final/
          if-no-files-found: error
          retention-days: 90
