name: Indexed Value Encryption

on:
  workflow_dispatch:
    inputs:

      artifact_id:
        description: "Encrypted GitHub Actions artifact ID"
        required: true
        type: string

      input_file:
        description: "JSON file inside decrypted ZIP"
        required: true
        type: string

      output_file:
        description: "Output JSON filename"
        required: true
        type: string

      output_artifact:
        description: "Output GitHub artifact name"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:

  transform:
    name: Build Indexed Encrypted Map

    runs-on: ubuntu-latest

    timeout-minutes: 120

    env:
      SOURCE_ARTIFACT_ID: ${{ inputs.artifact_id }}
      INPUT_FILE: ${{ inputs.input_file }}
      OUTPUT_FILE: ${{ inputs.output_file }}
      OUTPUT_ARTIFACT: ${{ inputs.output_artifact }}

    steps:

      # ======================================================
      # PREPARE
      # ======================================================

      - name: Prepare
        run: |
          set -euo pipefail

          mkdir -p source
          mkdir -p decrypted
          mkdir -p extracted
          mkdir -p output

      # ======================================================
      # DOWNLOAD ACTIONS ARTIFACT
      # ======================================================

      - name: Download encrypted artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Artifact ID: $SOURCE_ARTIFACT_ID"

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o source/actions-artifact.zip

          echo
          echo "Actions artifact downloaded:"
          ls -lh source/actions-artifact.zip

          unzip -t source/actions-artifact.zip

      # ======================================================
      # UNPACK ACTIONS WRAPPER
      #
      # GitHub Actions itself gives us a ZIP containing the
      # encrypted payload, e.g.
      #
      # ID-MAP-V1.zip.enc
      # ======================================================

      - name: Unpack Actions artifact
        run: |
          set -euo pipefail

          unzip -q \
            source/actions-artifact.zip \
            -d source/payload

          echo "Artifact contents:"
          find source/payload -type f -maxdepth 3 -print

          ENC_COUNT="$(
            find source/payload \
              -type f \
              -name '*.enc' \
              | wc -l
          )"

          if [[ "$ENC_COUNT" -ne 1 ]]; then
            echo
            echo "ERROR:"
            echo "Expected exactly one .enc payload."
            echo "Found: $ENC_COUNT"
            exit 1
          fi

          find source/payload \
            -type f \
            -name '*.enc' \
            -print -quit \
            > source/enc-path.txt

      # ======================================================
      # DECRYPT OUTER ENCRYPTED ZIP
      #
      # Same encryption used by canonical artifacts:
      #
      # AES-256-CBC
      # PBKDF2
      # 200000 iterations
      # SHA-256
      # ======================================================

      - name: Decrypt canonical payload
        env:
          CITY_DATA_KEY: ${{ secrets.CITY_DATA_KEY }}
        run: |
          set -euo pipefail

          test -n "${CITY_DATA_KEY:-}"

          ENC_FILE="$(cat source/enc-path.txt)"

          echo "Decrypting:"
          echo "$ENC_FILE"

          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -md sha256 \
            -in "$ENC_FILE" \
            -out decrypted/payload.zip \
            -pass env:CITY_DATA_KEY

          unzip -t decrypted/payload.zip

          echo
          echo "Canonical ZIP decrypted successfully."

      # ======================================================
      # UNZIP CANONICAL DATA
      # ======================================================

      - name: Extract canonical ZIP
        run: |
          set -euo pipefail

          unzip -q \
            decrypted/payload.zip \
            -d extracted

          echo "Extracted files:"
          find extracted -type f -print

      # ======================================================
      # FIND REQUESTED JSON
      # ======================================================

      - name: Locate input JSON
        run: |
          set -euo pipefail

          MATCH_COUNT="$(
            find extracted \
              -type f \
              -name "$INPUT_FILE" \
              | wc -l
          )"

          if [[ "$MATCH_COUNT" -ne 1 ]]; then
            echo
            echo "ERROR:"
            echo "Expected exactly one file named:"
            echo "$INPUT_FILE"
            echo
            echo "Found: $MATCH_COUNT"
            echo
            echo "Available files:"
            find extracted -type f -print
            exit 1
          fi

          find extracted \
            -type f \
            -name "$INPUT_FILE" \
            -print -quit \
            > source/input-path.txt

          echo "Input:"
          cat source/input-path.txt

      # ======================================================
      # TRANSFORM
      #
      # JSON:
      #
      # {
      #   "0001-000001": "Business Name"
      # }
      #
      # becomes:
      #
      # {
      #   "0001-000001": "v1:<nonce>:<ciphertext>:<tag>"
      # }
      #
      # Keys remain EXACTLY unchanged.
      #
      # AES-256-GCM per value.
      #
      # Key:
      # SHA-256(CITY_DATA_KEY)
      #
      # Nonce:
      # random 96-bit nonce per value.
      #
      # AAD:
      # the plaintext JSON key.
      #
      # This cryptographically binds each encrypted value
      # to the ID it belongs to.
      # ======================================================

      - name: Encrypt JSON values
        env:
          CITY_DATA_KEY: ${{ secrets.CITY_DATA_KEY }}
        run: |
          set -euo pipefail

          cat > /tmp/encrypt-values.js <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const path = require("path");

          const inputPath =
            fs.readFileSync(
              "source/input-path.txt",
              "utf8"
            ).trim();

          const outputFilename =
            process.env.OUTPUT_FILE;

          const outputPath =
            path.join(
              "output",
              outputFilename
            );

          const secret =
            process.env.CITY_DATA_KEY;

          if (!secret) {
            throw new Error(
              "CITY_DATA_KEY is missing"
            );
          }

          // --------------------------------------------------
          // Derive fixed 256-bit encryption key.
          //
          // Version 1 derivation:
          // SHA-256 over CITY_DATA_KEY UTF-8 bytes.
          // --------------------------------------------------

          const encryptionKey =
            crypto
              .createHash("sha256")
              .update(
                Buffer.from(
                  secret,
                  "utf8"
                )
              )
              .digest();

          // --------------------------------------------------
          // Read JSON
          // --------------------------------------------------

          console.log(
            "Reading:",
            inputPath
          );

          const raw =
            fs.readFileSync(
              inputPath,
              "utf8"
            );

          const data =
            JSON.parse(raw);

          if (
            data === null ||
            Array.isArray(data) ||
            typeof data !== "object"
          ) {
            throw new Error(
              "Input JSON root must be an object"
            );
          }

          const keys =
            Object.keys(data);

          console.log(
            "Keys:",
            keys.length.toLocaleString()
          );

          // --------------------------------------------------
          // Stream output.
          //
          // Do NOT build a second million-entry object.
          // --------------------------------------------------

          const fd =
            fs.openSync(
              outputPath,
              "w"
            );

          fs.writeSync(
            fd,
            "{\n"
          );

          let encryptedCount = 0;

          let stringCount = 0;
          let nullCount = 0;
          let objectCount = 0;
          let arrayCount = 0;
          let numberCount = 0;
          let booleanCount = 0;

          for (
            let i = 0;
            i < keys.length;
            i++
          ) {

            const key =
              keys[i];

            const value =
              data[key];

            // ----------------------------------------------
            // Preserve original JSON value semantics.
            //
            // Strings remain strings after decrypt.
            // Arrays/objects/numbers/etc are serialized as
            // JSON and marked by type.
            // ----------------------------------------------

            let type;
            let plaintext;

            if (
              typeof value === "string"
            ) {

              type = "s";
              plaintext = value;
              stringCount++;

            } else if (
              value === null
            ) {

              type = "0";
              plaintext = "null";
              nullCount++;

            } else if (
              Array.isArray(value)
            ) {

              type = "a";
              plaintext =
                JSON.stringify(value);
              arrayCount++;

            } else if (
              typeof value === "object"
            ) {

              type = "o";
              plaintext =
                JSON.stringify(value);
              objectCount++;

            } else if (
              typeof value === "number"
            ) {

              type = "n";
              plaintext =
                JSON.stringify(value);
              numberCount++;

            } else if (
              typeof value === "boolean"
            ) {

              type = "b";
              plaintext =
                value ? "true" : "false";
              booleanCount++;

            } else {

              throw new Error(
                `Unsupported value type at key ${key}`
              );

            }

            // ----------------------------------------------
            // Unique 96-bit nonce.
            // ----------------------------------------------

            const nonce =
              crypto.randomBytes(12);

            const cipher =
              crypto.createCipheriv(
                "aes-256-gcm",
                encryptionKey,
                nonce
              );

            // Bind ciphertext to plaintext ID/key.
            cipher.setAAD(
              Buffer.from(
                key,
                "utf8"
              )
            );

            const encrypted =
              Buffer.concat([
                cipher.update(
                  plaintext,
                  "utf8"
                ),
                cipher.final()
              ]);

            const tag =
              cipher.getAuthTag();

            // ----------------------------------------------
            // Compact base64url representation:
            //
            // v1:type:nonce:ciphertext:tag
            // ----------------------------------------------

            const encoded =
              [
                "v1",
                type,
                nonce.toString(
                  "base64url"
                ),
                encrypted.toString(
                  "base64url"
                ),
                tag.toString(
                  "base64url"
                )
              ].join(":");

            const line =
              "  " +
              JSON.stringify(key) +
              ": " +
              JSON.stringify(encoded) +
              (
                i + 1 < keys.length
                  ? ",\n"
                  : "\n"
              );

            fs.writeSync(
              fd,
              line
            );

            encryptedCount++;

            if (
              encryptedCount % 100000 === 0
            ) {

              console.log(
                "Encrypted:",
                encryptedCount
                  .toLocaleString()
              );

            }

          }

          fs.writeSync(
            fd,
            "}\n"
          );

          fs.closeSync(fd);

          // --------------------------------------------------
          // Summary
          // --------------------------------------------------

          const summary = {
            format:
              "indexed-value-encryption-v1",

            algorithm:
              "AES-256-GCM",

            key_derivation:
              "SHA-256(CITY_DATA_KEY)",

            nonce:
              "96-bit random per value",

            authentication:
              "128-bit GCM tag",

            aad:
              "plaintext JSON key",

            keys_encrypted:
              false,

            values_encrypted:
              true,

            records:
              encryptedCount,

            value_types: {
              string: stringCount,
              null: nullCount,
              object: objectCount,
              array: arrayCount,
              number: numberCount,
              boolean: booleanCount
            },

            input_file:
              path.basename(
                inputPath
              ),

            output_file:
              outputFilename
          };

          fs.writeFileSync(
            "output/encryption-summary.json",
            JSON.stringify(
              summary,
              null,
              2
            )
          );

          console.log("");
          console.log(
            "================================"
          );
          console.log(
            "VALUE ENCRYPTION COMPLETE"
          );
          console.log(
            "================================"
          );

          console.log(
            "Records:",
            encryptedCount.toLocaleString()
          );

          console.log(
            "Output:",
            outputPath
          );
          NODE

          node /tmp/encrypt-values.js

      # ======================================================
      # STRUCTURAL VERIFICATION
      #
      # Ensure:
      #
      # 1. same number of keys
      # 2. every original key exists
      # 3. no new keys
      # 4. every output value encrypted
      # ======================================================

      - name: Verify plaintext keys preserved
        run: |
          set -euo pipefail

          cat > /tmp/verify-structure.js <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const inputPath =
            fs.readFileSync(
              "source/input-path.txt",
              "utf8"
            ).trim();

          const outputPath =
            path.join(
              "output",
              process.env.OUTPUT_FILE
            );

          const original =
            JSON.parse(
              fs.readFileSync(
                inputPath,
                "utf8"
              )
            );

          const encrypted =
            JSON.parse(
              fs.readFileSync(
                outputPath,
                "utf8"
              )
            );

          const originalKeys =
            Object.keys(original);

          const encryptedKeys =
            Object.keys(encrypted);

          if (
            originalKeys.length !==
            encryptedKeys.length
          ) {

            throw new Error(
              `Key count mismatch: ` +
              `${originalKeys.length} != ` +
              `${encryptedKeys.length}`
            );

          }

          for (
            const key of originalKeys
          ) {

            if (
              !Object.prototype
                .hasOwnProperty
                .call(
                  encrypted,
                  key
                )
            ) {

              throw new Error(
                `Missing key: ${key}`
              );

            }

            const value =
              encrypted[key];

            if (
              typeof value !== "string" ||
              !value.startsWith("v1:")
            ) {

              throw new Error(
                `Unencrypted value: ${key}`
              );

            }

          }

          console.log(
            "Key count:",
            originalKeys.length
              .toLocaleString()
          );

          console.log(
            "All plaintext keys preserved."
          );

          console.log(
            "All values encrypted."
          );
          NODE

          node /tmp/verify-structure.js

      # ======================================================
      # CRYPTOGRAPHIC ROUND-TRIP VERIFICATION
      #
      # Decrypt EVERY value and compare it with the original.
      # ======================================================

      - name: Verify every encrypted value
        env:
          CITY_DATA_KEY: ${{ secrets.CITY_DATA_KEY }}
        run: |
          set -euo pipefail

          cat > /tmp/verify-values.js <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const path = require("path");

          const inputPath =
            fs.readFileSync(
              "source/input-path.txt",
              "utf8"
            ).trim();

          const outputPath =
            path.join(
              "output",
              process.env.OUTPUT_FILE
            );

          const secret =
            process.env.CITY_DATA_KEY;

          if (!secret) {
            throw new Error(
              "CITY_DATA_KEY missing"
            );
          }

          const encryptionKey =
            crypto
              .createHash("sha256")
              .update(
                Buffer.from(
                  secret,
                  "utf8"
                )
              )
              .digest();

          const original =
            JSON.parse(
              fs.readFileSync(
                inputPath,
                "utf8"
              )
            );

          const encrypted =
            JSON.parse(
              fs.readFileSync(
                outputPath,
                "utf8"
              )
            );

          let checked = 0;

          function expectedPlaintext(
            value,
            type
          ) {

            switch (type) {

              case "s":
                return value;

              case "0":
                return "null";

              case "a":
              case "o":
              case "n":
                return JSON.stringify(
                  value
                );

              case "b":
                return value
                  ? "true"
                  : "false";

              default:
                throw new Error(
                  `Unknown type ${type}`
                );

            }

          }

          for (
            const [
              key,
              encoded
            ] of Object.entries(
              encrypted
            )
          ) {

            const parts =
              encoded.split(":");

            if (
              parts.length !== 5 ||
              parts[0] !== "v1"
            ) {

              throw new Error(
                `Bad encrypted format: ${key}`
              );

            }

            const [
              version,
              type,
              nonce64,
              ciphertext64,
              tag64
            ] = parts;

            const nonce =
              Buffer.from(
                nonce64,
                "base64url"
              );

            const ciphertext =
              Buffer.from(
                ciphertext64,
                "base64url"
              );

            const tag =
              Buffer.from(
                tag64,
                "base64url"
              );

            const decipher =
              crypto.createDecipheriv(
                "aes-256-gcm",
                encryptionKey,
                nonce
              );

            decipher.setAAD(
              Buffer.from(
                key,
                "utf8"
              )
            );

            decipher.setAuthTag(
              tag
            );

            const plaintext =
              Buffer.concat([
                decipher.update(
                  ciphertext
                ),
                decipher.final()
              ]).toString(
                "utf8"
              );

            const expected =
              expectedPlaintext(
                original[key],
                type
              );

            if (
              plaintext !== expected
            ) {

              throw new Error(
                `Round-trip mismatch: ${key}`
              );

            }

            checked++;

            if (
              checked % 100000 === 0
            ) {

              console.log(
                "Verified:",
                checked
                  .toLocaleString()
              );

            }

          }

          console.log("");
          console.log(
            "Cryptographically verified:",
            checked.toLocaleString(),
            "values"
          );
          NODE

          node /tmp/verify-values.js

      # ======================================================
      # SHOW OUTPUT
      # ======================================================

      - name: Output statistics
        run: |
          set -euo pipefail

          echo
          echo "Output files:"
          ls -lh output/

          echo
          echo "Summary:"
          cat output/encryption-summary.json

          echo
          echo "SHA256:"
          sha256sum \
            "output/$OUTPUT_FILE"

      # ======================================================
      # UPLOAD DERIVATIVE
      #
      # Canonical artifact remains untouched.
      # ======================================================

      - name: Upload indexed encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_artifact }}
          path: |
            output/${{ inputs.output_file }}
            output/encryption-summary.json
          if-no-files-found: error
          retention-days: 90
