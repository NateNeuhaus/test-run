name: Indexed Value Encryption

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "Encrypted source artifact ID"
        required: true
        type: string

      input_file:
        description: "JSON file inside decrypted artifact"
        required: true
        type: string

      output_file:
        description: "Final indexed encrypted JSON filename"
        required: true
        type: string

      output_artifact:
        description: "Final GitHub artifact name"
        required: true
        type: string

      workers:
        description: "Parallel worker count"
        required: true
        default: "16"
        type: string

permissions:
  contents: read
  actions: read

jobs:

  # ==========================================================
  # PREPARE
  #
  # Download canonical encrypted artifact once.
  # Decrypt outer AES-CBC package.
  # Extract requested JSON.
  # Split it deterministically.
  # ==========================================================

  prepare:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      source_records: ${{ steps.meta.outputs.source_records }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate worker count
        shell: bash
        run: |
          set -euo pipefail

          WORKERS='${{ inputs.workers }}'

          if ! [[ "$WORKERS" =~ ^[0-9]+$ ]]; then
            echo "Invalid workers: $WORKERS"
            exit 1
          fi

          if [ "$WORKERS" -lt 1 ] || [ "$WORKERS" -gt 64 ]; then
            echo "workers must be between 1 and 64"
            exit 1
          fi

      - name: Download encrypted source artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/artifact

          echo "Downloading artifact ID: $ARTIFACT_ID"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o work/artifact-wrapper.zip

          unzip -q \
            work/artifact-wrapper.zip \
            -d work/artifact

          echo "Artifact contents:"
          find work/artifact -type f -print

      - name: Find encrypted payload
        id: encrypted
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t FILES < <(
            find work/artifact \
              -type f \
              -name '*.enc' \
              -print
          )

          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one .enc file."
            echo "Found: ${#FILES[@]}"
            printf '%s\n' "${FILES[@]}"
            exit 1
          fi

          echo "file=${FILES[0]}" >> "$GITHUB_OUTPUT"

          echo "Encrypted payload:"
          echo "${FILES[0]}"

      - name: Decrypt canonical package
        env:
          CITY_DATA_KEY: ${{ secrets.CITY_DATA_KEY }}
          ENCRYPTED_FILE: ${{ steps.encrypted.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CITY_DATA_KEY:-}" ]; then
            echo "CITY_DATA_KEY is unavailable."
            exit 1
          fi

          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -md sha256 \
            -pass env:CITY_DATA_KEY \
            -in "$ENCRYPTED_FILE" \
            -out work/payload.zip

          unzip -t work/payload.zip

          mkdir -p work/payload

          unzip -q \
            work/payload.zip \
            -d work/payload

          echo "Decrypted package:"
          find work/payload -type f -print

      - name: Locate requested JSON
        id: input
        env:
          REQUESTED_FILE: ${{ inputs.input_file }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t MATCHES < <(
            find work/payload \
              -type f \
              -name "$REQUESTED_FILE" \
              -print
          )

          if [ "${#MATCHES[@]}" -ne 1 ]; then
            echo "Expected exactly one file named:"
            echo "$REQUESTED_FILE"
            echo
            echo "Found: ${#MATCHES[@]}"
            printf '%s\n' "${MATCHES[@]}"
            exit 1
          fi

          cp "${MATCHES[0]}" work/input.json

          echo "Input:"
          echo "${MATCHES[0]}"

          sha256sum work/input.json

      - name: Verify splitter
        shell: bash
        run: |
          set -euo pipefail

          test -f parallel-splitter.js

          node --check parallel-splitter.js

          grep -q \
            'PARALLEL SPLITTER' \
            parallel-splitter.js

      - name: Split input
        env:
          WORKERS: ${{ inputs.workers }}
        shell: bash
        run: |
          set -euo pipefail

          node parallel-splitter.js \
            --input work/input.json \
            --output work/shards \
            --workers "$WORKERS"

      - name: Read split metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_RECORDS="$(
            node -e '
              const m =
                require("./work/shards/manifest.json");

              process.stdout.write(
                String(m.source_records)
              );
            '
          )"

          echo "source_records=$SOURCE_RECORDS" \
            >> "$GITHUB_OUTPUT"

          echo "Source records: $SOURCE_RECORDS"

      - name: Build worker matrix
        id: matrix
        env:
          WORKERS: ${{ inputs.workers }}
        shell: bash
        run: |
          set -euo pipefail

          MATRIX="$(
            node - "$WORKERS" <<'NODE'
          const workers = Number(process.argv[2]);

          const width =
            Math.max(
              2,
              String(workers - 1).length
            );

          const include = [];

          for (
            let worker = 0;
            worker < workers;
            worker++
          ) {
            include.push({
              worker,
              shard:
                String(worker)
                  .padStart(width, "0")
            });
          }

          process.stdout.write(
            JSON.stringify({ include })
          );
          NODE
          )"

          echo "Matrix:"
          echo "$MATRIX"

          echo "matrix=$MATRIX" \
            >> "$GITHUB_OUTPUT"

      - name: Upload split shards
        uses: actions/upload-artifact@v4
        with:
          name: indexed-encryption-input
          path: |
            work/shards/
          if-no-files-found: error
          retention-days: 1


  # ==========================================================
  # PROCESS
  #
  # 16-way matrix by default.
  #
  # Each worker:
  #   - downloads the split package
  #   - selects exactly one shard
  #   - independently encrypts every value
  #   - leaves keys plaintext
  #   - verifies every ciphertext by decrypting it immediately
  # ==========================================================

  process:
    needs: prepare

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Download split shards
        uses: actions/download-artifact@v4
        with:
          name: indexed-encryption-input
          path: work/shards

      - name: Show worker
        shell: bash
        run: |
          echo "Worker: ${{ matrix.worker }}"
          echo "Shard:  ${{ matrix.shard }}"

      - name: Encrypt shard values
        env:
          CITY_DATA_KEY: ${{ secrets.CITY_DATA_KEY }}
          SHARD_ID: ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail

          INPUT="work/shards/shard-${SHARD_ID}.json"
          OUTPUT="work/encrypted-${SHARD_ID}.json"

          if [ ! -f "$INPUT" ]; then
            echo "Missing shard: $INPUT"
            exit 1
          fi

          node - "$INPUT" "$OUTPUT" <<'NODE'
          "use strict";

          const fs =
            require("fs");

          const crypto =
            require("crypto");

          const inputFile =
            process.argv[2];

          const outputFile =
            process.argv[3];

          const secret =
            process.env.CITY_DATA_KEY;

          if (!secret) {
            throw new Error(
              "CITY_DATA_KEY unavailable"
            );
          }

          // ==================================================
          // KDF
          //
          // Stable domain-separated key derivation.
          //
          // The secret itself is never written.
          // ==================================================

          const encryptionKey =
            crypto
              .createHmac(
                "sha256",
                Buffer.from(
                  secret,
                  "utf8"
                )
              )
              .update(
                "mtc:indexed-value-encryption:v1",
                "utf8"
              )
              .digest();

          function encode(buffer) {
            return buffer
              .toString("base64")
              .replace(/\+/g, "-")
              .replace(/\//g, "_")
              .replace(/=+$/g, "");
          }

          function decode(value) {
            let s =
              value
                .replace(/-/g, "+")
                .replace(/_/g, "/");

            while (
              s.length % 4
            ) {
              s += "=";
            }

            return Buffer.from(
              s,
              "base64"
            );
          }

          function valueType(value) {
            if (value === null) {
              return "0";
            }

            if (
              Array.isArray(value)
            ) {
              return "a";
            }

            switch (
              typeof value
            ) {
              case "string":
                return "s";

              case "number":
                return "n";

              case "boolean":
                return "b";

              case "object":
                return "o";

              default:
                throw new Error(
                  "Unsupported JSON value type"
                );
            }
          }

          function serialize(value) {
            return Buffer.from(
              JSON.stringify(value),
              "utf8"
            );
          }

          function deserialize(buffer) {
            return JSON.parse(
              buffer.toString("utf8")
            );
          }

          function encryptValue(
            id,
            value
          ) {
            const type =
              valueType(value);

            const nonce =
              crypto.randomBytes(12);

            const cipher =
              crypto.createCipheriv(
                "aes-256-gcm",
                encryptionKey,
                nonce
              );

            // Bind ciphertext to its plaintext ID.
            //
            // Moving ciphertext from one ID to another
            // causes authentication failure.

            cipher.setAAD(
              Buffer.from(
                id,
                "utf8"
              )
            );

            const ciphertext =
              Buffer.concat([
                cipher.update(
                  serialize(value)
                ),
                cipher.final()
              ]);

            const tag =
              cipher.getAuthTag();

            return [
              "v1",
              type,
              encode(nonce),
              encode(ciphertext),
              encode(tag)
            ].join(":");
          }

          function decryptValue(
            id,
            packed
          ) {
            const parts =
              packed.split(":");

            if (
              parts.length !== 5 ||
              parts[0] !== "v1"
            ) {
              throw new Error(
                "Invalid encrypted value format"
              );
            }

            const [
              version,
              type,
              nonceText,
              ciphertextText,
              tagText
            ] = parts;

            const decipher =
              crypto.createDecipheriv(
                "aes-256-gcm",
                encryptionKey,
                decode(nonceText)
              );

            decipher.setAAD(
              Buffer.from(
                id,
                "utf8"
              )
            );

            decipher.setAuthTag(
              decode(tagText)
            );

            const plaintext =
              Buffer.concat([
                decipher.update(
                  decode(ciphertextText)
                ),
                decipher.final()
              ]);

            const value =
              deserialize(plaintext);

            if (
              valueType(value) !== type
            ) {
              throw new Error(
                `Type verification failed for ${id}`
              );
            }

            return value;
          }

          function exactEqual(a, b) {
            return (
              JSON.stringify(a) ===
              JSON.stringify(b)
            );
          }

          const input =
            JSON.parse(
              fs.readFileSync(
                inputFile,
                "utf8"
              )
            );

          if (
            input === null ||
            Array.isArray(input) ||
            typeof input !== "object"
          ) {
            throw new Error(
              "Indexed encryption currently requires an object root"
            );
          }

          const output =
            Object.create(null);

          const entries =
            Object.entries(input);

          console.log(
            "Records:",
            entries.length
              .toLocaleString()
          );

          let encrypted = 0;

          for (
            const [id, value]
            of entries
          ) {
            const packed =
              encryptValue(
                id,
                value
              );

            // Immediate cryptographic round-trip.
            const recovered =
              decryptValue(
                id,
                packed
              );

            if (
              !exactEqual(
                value,
                recovered
              )
            ) {
              throw new Error(
                `Round-trip mismatch: ${id}`
              );
            }

            output[id] =
              packed;

            encrypted++;

            if (
              encrypted % 10000 === 0
            ) {
              console.log(
                "Encrypted:",
                encrypted
                  .toLocaleString()
              );
            }
          }

          if (
            Object.keys(output).length !==
            entries.length
          ) {
            throw new Error(
              "Output key count mismatch"
            );
          }

          fs.writeFileSync(
            outputFile,
            JSON.stringify(output)
          );

          console.log(
            "Encrypted:",
            encrypted
              .toLocaleString()
          );

          console.log(
            "Worker verification: YES"
          );
          NODE

          sha256sum "$OUTPUT"

      - name: Upload encrypted shard
        uses: actions/upload-artifact@v4
        with:
          name: indexed-encrypted-${{ matrix.shard }}
          path: work/encrypted-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1


  # ==========================================================
  # MERGE
  #
  # Rebuild one object from all encrypted shards.
  #
  # We deliberately do not use the original splitter manifest
  # hashes here because processing has legitimately changed the
  # shard contents.
  #
  # Instead we verify:
  #   - every expected worker artifact exists
  #   - exact expected number of shards
  #   - no duplicate keys
  #   - every value has expected encrypted format
  #   - merged key count == original source count
  # ==========================================================

  merge:
    needs:
      - prepare
      - process

    runs-on: ubuntu-latest

    steps:
      - name: Download all encrypted shards
        uses: actions/download-artifact@v4
        with:
          pattern: indexed-encrypted-*
          path: work/encrypted
          merge-multiple: true

      - name: Inspect encrypted shards
        shell: bash
        run: |
          set -euo pipefail

          find work/encrypted \
            -type f \
            -name 'encrypted-*.json' \
            -print \
            | sort

      - name: Merge and verify
        env:
          EXPECTED_RECORDS: ${{ needs.prepare.outputs.source_records }}
          EXPECTED_WORKERS: ${{ inputs.workers }}
          OUTPUT_FILE: ${{ inputs.output_file }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p final

          node - \
            work/encrypted \
            "final/$OUTPUT_FILE" \
            "$EXPECTED_RECORDS" \
            "$EXPECTED_WORKERS" <<'NODE'
          "use strict";

          const fs =
            require("fs");

          const path =
            require("path");

          const crypto =
            require("crypto");

          const inputDir =
            process.argv[2];

          const outputFile =
            process.argv[3];

          const expectedRecords =
            Number(
              process.argv[4]
            );

          const expectedWorkers =
            Number(
              process.argv[5]
            );

          if (
            !Number.isInteger(
              expectedRecords
            ) ||
            expectedRecords < 0
          ) {
            throw new Error(
              "Invalid expected record count"
            );
          }

          if (
            !Number.isInteger(
              expectedWorkers
            ) ||
            expectedWorkers < 1
          ) {
            throw new Error(
              "Invalid expected worker count"
            );
          }

          const files =
            fs
              .readdirSync(
                inputDir
              )
              .filter(
                name =>
                  /^encrypted-\d+\.json$/
                    .test(name)
              )
              .sort();

          console.log(
            "Encrypted shards:",
            files.length
          );

          if (
            files.length !==
            expectedWorkers
          ) {
            throw new Error(
              `Expected ${expectedWorkers} encrypted shards; found ${files.length}`
            );
          }

          const merged =
            Object.create(null);

          let records = 0;

          for (
            const filename
            of files
          ) {
            const fullPath =
              path.join(
                inputDir,
                filename
              );

            const shard =
              JSON.parse(
                fs.readFileSync(
                  fullPath,
                  "utf8"
                )
              );

            if (
              shard === null ||
              Array.isArray(shard) ||
              typeof shard !== "object"
            ) {
              throw new Error(
                `${filename} is not an object`
              );
            }

            const entries =
              Object.entries(shard);

            console.log(
              filename,
              entries.length
                .toLocaleString(),
              "records"
            );

            for (
              const [id, value]
              of entries
            ) {
              if (
                Object.prototype
                  .hasOwnProperty
                  .call(
                    merged,
                    id
                  )
              ) {
                throw new Error(
                  `Duplicate key: ${id}`
                );
              }

              if (
                typeof value !==
                "string"
              ) {
                throw new Error(
                  `Non-string encrypted value: ${id}`
                );
              }

              if (
                !/^v1:[s0aonb]:[A-Za-z0-9_-]+:[A-Za-z0-9_-]+:[A-Za-z0-9_-]+$/
                  .test(value)
              ) {
                throw new Error(
                  `Invalid encrypted format: ${id}`
                );
              }

              merged[id] =
                value;

              records++;
            }
          }

          if (
            records !==
            expectedRecords
          ) {
            throw new Error(
              `Merged records ${records} != expected ${expectedRecords}`
            );
          }

          fs.writeFileSync(
            outputFile,
            JSON.stringify(merged)
          );

          const outputHash =
            crypto
              .createHash(
                "sha256"
              )
              .update(
                fs.readFileSync(
                  outputFile
                )
              )
              .digest("hex");

          console.log("");
          console.log(
            "========================================"
          );
          console.log(
            "INDEXED ENCRYPTION MERGE COMPLETE"
          );
          console.log(
            "========================================"
          );

          console.log(
            "Workers:        ",
            expectedWorkers
          );

          console.log(
            "Source records: ",
            expectedRecords
              .toLocaleString()
          );

          console.log(
            "Merged records: ",
            records
              .toLocaleString()
          );

          console.log(
            "Duplicate keys: 0"
          );

          console.log(
            "Missing keys:   0"
          );

          console.log(
            "Output SHA256:  ",
            outputHash
          );

          console.log(
            "Verified:       YES"
          );
          NODE

      # ======================================================
      # FULL CRYPTOGRAPHIC VERIFICATION
      #
      # Download original split shards again.
      # Compare EVERY final encrypted value against its original
      # plaintext value after AES-GCM decryption.
      #
      # This catches:
      #   wrong secret
      #   corrupt ciphertext
      #   swapped IDs
      #   missing IDs
      #   incorrect values
      # ======================================================

      - name: Download original shards for final verification
        uses: actions/download-artifact@v4
        with:
          name: indexed-encryption-input
          path: work/original

      - name: Full cryptographic verification
        env:
          CITY_DATA_KEY: ${{ secrets.CITY_DATA_KEY }}
          OUTPUT_FILE: ${{ inputs.output_file }}
          EXPECTED_RECORDS: ${{ needs.prepare.outputs.source_records }}
        shell: bash
        run: |
          set -euo pipefail

          node - \
            work/original \
            "final/$OUTPUT_FILE" \
            "$EXPECTED_RECORDS" <<'NODE'
          "use strict";

          const fs =
            require("fs");

          const path =
            require("path");

          const crypto =
            require("crypto");

          const originalDir =
            process.argv[2];

          const encryptedFile =
            process.argv[3];

          const expectedRecords =
            Number(
              process.argv[4]
            );

          const secret =
            process.env.CITY_DATA_KEY;

          if (!secret) {
            throw new Error(
              "CITY_DATA_KEY unavailable"
            );
          }

          const encryptionKey =
            crypto
              .createHmac(
                "sha256",
                Buffer.from(
                  secret,
                  "utf8"
                )
              )
              .update(
                "mtc:indexed-value-encryption:v1",
                "utf8"
              )
              .digest();

          function decode(value) {
            let s =
              value
                .replace(/-/g, "+")
                .replace(/_/g, "/");

            while (
              s.length % 4
            ) {
              s += "=";
            }

            return Buffer.from(
              s,
              "base64"
            );
          }

          function decryptValue(
            id,
            packed
          ) {
            const parts =
              packed.split(":");

            if (
              parts.length !== 5 ||
              parts[0] !== "v1"
            ) {
              throw new Error(
                `Bad format: ${id}`
              );
            }

            const [
              version,
              type,
              nonceText,
              ciphertextText,
              tagText
            ] = parts;

            const decipher =
              crypto.createDecipheriv(
                "aes-256-gcm",
                encryptionKey,
                decode(nonceText)
              );

            decipher.setAAD(
              Buffer.from(
                id,
                "utf8"
              )
            );

            decipher.setAuthTag(
              decode(tagText)
            );

            const plaintext =
              Buffer.concat([
                decipher.update(
                  decode(ciphertextText)
                ),
                decipher.final()
              ]);

            return JSON.parse(
              plaintext.toString(
                "utf8"
              )
            );
          }

          const encrypted =
            JSON.parse(
              fs.readFileSync(
                encryptedFile,
                "utf8"
              )
            );

          const shardFiles =
            fs
              .readdirSync(
                originalDir
              )
              .filter(
                name =>
                  /^shard-\d+\.json$/
                    .test(name)
              )
              .sort();

          let verified = 0;

          for (
            const filename
            of shardFiles
          ) {
            const original =
              JSON.parse(
                fs.readFileSync(
                  path.join(
                    originalDir,
                    filename
                  ),
                  "utf8"
                )
              );

            for (
              const [id, value]
              of Object.entries(
                original
              )
            ) {
              if (
                !Object.prototype
                  .hasOwnProperty
                  .call(
                    encrypted,
                    id
                  )
              ) {
                throw new Error(
                  `Missing encrypted ID: ${id}`
                );
              }

              const recovered =
                decryptValue(
                  id,
                  encrypted[id]
                );

              if (
                JSON.stringify(
                  recovered
                ) !==
                JSON.stringify(
                  value
                )
              ) {
                throw new Error(
                  `Final value mismatch: ${id}`
                );
              }

              verified++;

              if (
                verified % 100000 === 0
              ) {
                console.log(
                  "Verified:",
                  verified
                    .toLocaleString()
                );
              }
            }
          }

          if (
            verified !==
            expectedRecords
          ) {
            throw new Error(
              `Verified ${verified} != expected ${expectedRecords}`
            );
          }

          if (
            Object.keys(
              encrypted
            ).length !==
            expectedRecords
          ) {
            throw new Error(
              "Final encrypted key count mismatch"
            );
          }

          console.log("");
          console.log(
            "FULL CRYPTOGRAPHIC VERIFICATION"
          );

          console.log(
            "Records:",
            verified
              .toLocaleString()
          );

          console.log(
            "Exact plaintext recovery: YES"
          );

          console.log(
            "AAD/key binding: YES"
          );

          console.log(
            "Verification: PASSED"
          );
          NODE

      - name: Create metadata
        env:
          OUTPUT_FILE: ${{ inputs.output_file }}
          SOURCE_ARTIFACT: ${{ inputs.artifact_id }}
          SOURCE_RECORDS: ${{ needs.prepare.outputs.source_records }}
          WORKERS: ${{ inputs.workers }}
        shell: bash
        run: |
          set -euo pipefail

          SHA="$(
            sha256sum \
              "final/$OUTPUT_FILE" \
              | awk '{print $1}'
          )"

          SIZE="$(
            stat -c '%s' \
              "final/$OUTPUT_FILE"
          )"

          cat > final/indexed-encryption-summary.json <<JSON
          {
            "format": "indexed-value-encryption-v1",
            "source_artifact_id": "$SOURCE_ARTIFACT",
            "source_records": $SOURCE_RECORDS,
            "workers": $WORKERS,
            "algorithm": "AES-256-GCM",
            "nonce_bytes": 12,
            "aad": "plaintext JSON key",
            "kdf": "HMAC-SHA256 domain-separated v1",
            "value_format": "v1:type:nonce:ciphertext:tag",
            "output_file": "$OUTPUT_FILE",
            "output_bytes": $SIZE,
            "output_sha256": "$SHA",
            "full_cryptographic_verification": true
          }
          JSON

          cat \
            final/indexed-encryption-summary.json

      - name: Upload final indexed encrypted map
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_artifact }}
          path: |
            final/${{ inputs.output_file }}
            final/indexed-encryption-summary.json
          if-no-files-found: error
          retention-days: 90
