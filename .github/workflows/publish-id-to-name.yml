name: Publish ID to Name Registry

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ============================================================
      # DOWNLOAD OLD CANONICAL ARTIFACT DIRECTLY BY ARTIFACT ID
      #
      # IMPORTANT:
      # Do NOT use actions/download-artifact here.
      # Artifact 9899370888 belongs to an older workflow run.
      # ============================================================

      - name: Download canonical artifact directly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source-artifact

          echo "Downloading artifact 9899370888 directly..."

          curl \
            --fail \
            --location \
            --show-error \
            --silent \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/NateNeuhaus/test-run/actions/artifacts/9899370888/zip" \
            -o source-artifact/artifact.zip

          test -s source-artifact/artifact.zip

          echo "Artifact downloaded:"
          ls -lh source-artifact/artifact.zip

          unzip -q source-artifact/artifact.zip \
            -d source-artifact/unpacked

          echo "Artifact contents:"
          find source-artifact/unpacked -type f -maxdepth 3 -print


      # ============================================================
      # DECRYPT CANONICAL ID MAP
      # ============================================================

      - name: Decrypt canonical ID map
        env:
          CITY_DATA_KEY: ${{ secrets.CITY_DATA_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          ENC="$(
            find source-artifact/unpacked \
              -type f \
              -name '*.enc' \
              -print \
              -quit
          )"

          if [[ -z "$ENC" ]]; then
            echo "ERROR: encrypted payload not found"
            find source-artifact/unpacked -type f -print
            exit 1
          fi

          mkdir -p work/extracted

          echo "Decrypting:"
          echo "$ENC"

          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -md sha256 \
            -pass env:CITY_DATA_KEY \
            -in "$ENC" \
            -out work/ID-MAP-V1.zip

          unzip -q \
            work/ID-MAP-V1.zip \
            -d work/extracted

          MAP="$(
            find work/extracted \
              -type f \
              -name 'id-map.json' \
              -print \
              -quit
          )"

          if [[ -z "$MAP" ]]; then
            echo "ERROR: id-map.json not found"
            find work/extracted -type f -print
            exit 1
          fi

          cp "$MAP" work/id-map.json

          echo "Canonical ID map:"
          ls -lh work/id-map.json


      # ============================================================
      # CONVERT
      #
      # 0001-000001 -> 0001.json
      # 0001-000002 -> 0001.json
      # 0002-000001 -> 0002.json
      #
      # 0001.json:
      #
      # {
      #   "0001-000001": "Business One",
      #   "0001-000002": "Business Two"
      # }
      # ============================================================

      - name: Build ID registry
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");

          const INPUT = "work/id-map.json";
          const OUTPUT = "work/id-to-name";

          const raw = fs.readFileSync(INPUT, "utf8");
          const source = JSON.parse(raw);

          if (
            source === null ||
            Array.isArray(source) ||
            typeof source !== "object"
          ) {
            throw new Error("id-map.json root must be an object");
          }

          fs.rmSync(OUTPUT, {
            recursive: true,
            force: true
          });

          fs.mkdirSync(OUTPUT, {
            recursive: true
          });

          const groups = Object.create(null);

          let sourceCount = 0;

          for (const [id, name] of Object.entries(source)) {

            if (!/^\d{4}-\d{6}$/.test(id)) {
              throw new Error(
                `INVALID ID: ${id}`
              );
            }

            if (typeof name !== "string") {
              throw new Error(
                `INVALID BUSINESS NAME TYPE: ${id}`
              );
            }

            const prefix = id.slice(0, 4);

            if (!groups[prefix]) {
              groups[prefix] = Object.create(null);
            }

            if (
              Object.prototype.hasOwnProperty.call(
                groups[prefix],
                id
              )
            ) {
              throw new Error(
                `DUPLICATE ID: ${id}`
              );
            }

            groups[prefix][id] = name;

            sourceCount++;
          }

          const prefixes =
            Object.keys(groups).sort();

          let outputCount = 0;

          for (const prefix of prefixes) {

            const group = groups[prefix];

            const file =
              path.join(
                OUTPUT,
                `${prefix}.json`
              );

            const ids = Object.keys(group);

            for (const id of ids) {

              if (id.slice(0, 4) !== prefix) {
                throw new Error(
                  `PREFIX ERROR: ${id}`
                );
              }

            }

            outputCount += ids.length;

            fs.writeFileSync(
              file,
              JSON.stringify(
                group,
                null,
                2
              ) + "\n"
            );
          }

          if (outputCount !== sourceCount) {
            throw new Error(
              `COUNT MISMATCH source=${sourceCount} output=${outputCount}`
            );
          }


          // ========================================================
          // FULL SECOND-PASS VERIFICATION
          // ========================================================

          let verified = 0;

          const seen = new Set();

          for (const prefix of prefixes) {

            const file =
              path.join(
                OUTPUT,
                `${prefix}.json`
              );

            const group =
              JSON.parse(
                fs.readFileSync(
                  file,
                  "utf8"
                )
              );

            for (
              const [id, name]
              of Object.entries(group)
            ) {

              if (seen.has(id)) {
                throw new Error(
                  `DUPLICATE OUTPUT ID: ${id}`
                );
              }

              seen.add(id);

              if (
                !Object.prototype.hasOwnProperty.call(
                  source,
                  id
                )
              ) {
                throw new Error(
                  `EXTRA OUTPUT ID: ${id}`
                );
              }

              if (source[id] !== name) {
                throw new Error(
                  `NAME CHANGED: ${id}`
                );
              }

              if (
                id.slice(0, 4)
                !== prefix
              ) {
                throw new Error(
                  `WRONG OUTPUT FILE: ${id}`
                );
              }

              verified++;
            }
          }


          if (
            verified !== sourceCount ||
            seen.size !== sourceCount
          ) {
            throw new Error(
              `VERIFICATION FAILURE source=${sourceCount} verified=${verified}`
            );
          }


          const summary = {

            format:
              "id-to-name-prefix-registry-v1",

            source_artifact_id:
              9899370888,

            source_records:
              sourceCount,

            output_records:
              outputCount,

            verified_records:
              verified,

            output_files:
              prefixes.length,

            source_sha256:
              crypto
                .createHash("sha256")
                .update(raw)
                .digest("hex"),

            verified:
              true
          };


          fs.writeFileSync(
            "work/id-to-name-summary.json",
            JSON.stringify(
              summary,
              null,
              2
            ) + "\n"
          );


          console.log("");
          console.log(
            "========================================"
          );

          console.log(
            " ID -> NAME REGISTRY VERIFIED"
          );

          console.log(
            "========================================"
          );

          console.log(
            `Source records:   ${sourceCount.toLocaleString()}`
          );

          console.log(
            `Output records:   ${outputCount.toLocaleString()}`
          );

          console.log(
            `Verified records: ${verified.toLocaleString()}`
          );

          console.log(
            `Registry files:   ${prefixes.length}`
          );

          console.log(
            "Exact match:      YES"
          );

          console.log(
            "========================================"
          );
          NODE


      # ============================================================
      # CLONE DESTINATION
      # ============================================================

      - name: Clone contractor-wiki-data
        env:
          TARGET_TOKEN: ${{ secrets.CONTRACTOR_WIKI_DATA }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TARGET_TOKEN:-}" ]]; then
            echo "ERROR: CONTRACTOR_WIKI_DATA secret missing"
            exit 1
          fi

          AUTH="$(
            printf 'x-access-token:%s' "$TARGET_TOKEN" |
            base64 -w0
          )"

          git \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone \
            --depth 1 \
            "https://github.com/NateNeuhaus/contractor-wiki-data.git" \
            target


      # ============================================================
      # COPY REGISTRY
      # ============================================================

      - name: Install registry
        shell: bash
        run: |
          set -euo pipefail

          rm -rf target/id-to-name

          mkdir -p target/id-to-name

          cp \
            work/id-to-name/*.json \
            target/id-to-name/

          cp \
            work/id-to-name-summary.json \
            target/id-to-name/_summary.json

          echo "Files ready:"
          find target/id-to-name \
            -maxdepth 1 \
            -type f |
            wc -l


      # ============================================================
      # COMMIT + PUSH
      # ============================================================

      - name: Push registry
        env:
          TARGET_TOKEN: ${{ secrets.CONTRACTOR_WIKI_DATA }}
        shell: bash
        run: |
          set -euo pipefail

          AUTH="$(
            printf 'x-access-token:%s' "$TARGET_TOKEN" |
            base64 -w0
          )"

          cd target

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all id-to-name

          if git diff --cached --quiet; then

            echo "Registry already current."

            exit 0

          fi

          git commit \
            -m "Publish ID to business-name registry"

          git \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push \
            origin \
            HEAD:main

          echo ""
          echo "========================================"
          echo " PUBLISHED"
          echo "========================================"
          echo "Repo: NateNeuhaus/contractor-wiki-data"
          echo "Path: id-to-name/"
          echo "========================================"