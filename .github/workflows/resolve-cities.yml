                  ):

                      bad_city.append(r)

          print(
              "Valid JSONL records:",
              len(good)
          )

          print(
              "Malformed JSON records:",
              len(malformed)
          )

          print(
              "Malformed city values:",
              len(bad_city)
          )

          if malformed:

              q = pathlib.Path(
                  "out/malformed-jsonl-records.txt"
              )

              with q.open("wb") as f:

                  for (
                      lineno,
                      raw,
                      exc
                  ) in malformed:

                      f.write(
                          (
                              f"LINE {lineno}\n"
                              f"ERROR: "
                              f"{type(exc).__name__}: "
                              f"{exc}\n"
                              f"BYTES: "
                              f"{len(raw)}\n"
                              f"CONTENT:\n"
                          ).encode("utf-8")
                      )

                      f.write(
                          raw[:10000]
                      )

                      if not raw.endswith(
                          b"\n"
                      ):

                          f.write(b"\n")

                      f.write(
                          b"\n"
                          b"------------------------"
                          b"\n\n"
                      )

              tmp = pathlib.Path(
