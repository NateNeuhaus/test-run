                      f.fileno()
                  )

              os.replace(
                  tmp,
                  p
              )

              print(
                  "Repaired results.jsonl; "
                  "corrupt records quarantined:",
                  len(malformed)
              )

          if bad_city:

              for r in bad_city[:20]:

                  print(
                      json.dumps(
                          r,
                          ensure_ascii=False
                      )
                  )

              raise SystemExit(
                  "FAILED: malformed city "
                  "values emitted"
              )

          print("Output usable.")
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: city-results-${{ matrix.chunk }}
          path: out/
          retention-days: 7


  # ============================================================
  # RETRY ONLY FAILED SHARDS
  # ============================================================

  retry:
    if: ${{ inputs.mode == 'retry' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 5

      matrix:
        chunk:
          [
            "00",
            "04",
            "08",
            "10",
            "14"
          ]

    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        run: |
          set -euo pipefail

          cp map-name-to-city-fixed resolver

          python3 - <<'PY'
          from pathlib import Path

          p = Path("resolver")
          s = p.read_text()

          replacements = {
            '"/home/ideapad/Documents/Files/temp/count/clean-up/json"':
              'process.env.JSON_DIR',

            '"/home/ideapad/Documents/Files/temp/us-cities.csv"':
              'process.env.CITIES_CSV',

            '"/home/ideapad/Documents/Files/temp/zip-code-to-usa-city-stat.txt"':
              'process.env.ZIP_FILE',

            '"/home/ideapad/Documents/Files/temp/count/name-to-city-resolved.jsonl"':
              'process.env.OUTPUT',

            '"/home/ideapad/Documents/Files/temp/count/name-to-city-resolved-diagnostics.jsonl"':
              'process.env.DIAGNOSTICS',

            '"/home/ideapad/Documents/Files/temp/count/name-to-city-resolved-checkpoint.json"':
              'process.env.CHECKPOINT'
          }

          for a, b in replacements.items():
              s = s.replace(a, b)

          p.write_text(s)
          PY

          node --check resolver

          mkdir -p json out

      - name: Download and decrypt
        env:
          CITY_DATA_KEY: ${{ secrets.CITY_DATA_KEY }}
        run: |
          set -euo pipefail

          test -n "$CITY_DATA_KEY"

          curl -fL --retry 5 \
            "$RELEASE_BASE/city-data-${{ matrix.chunk }}.tar.gz.enc" \
            -o chunk.enc

          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -md sha256 \
            -in chunk.enc \
            -out chunk.tar.gz \
            -pass env:CITY_DATA_KEY

          tar -xzf chunk.tar.gz -C json

          rm chunk.enc chunk.tar.gz

      - name: Normalize matrix sources
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import pathlib
          import os

          for p in pathlib.Path(
              "json"
          ).glob("*.json"):

              try:
                  data = json.loads(
                      p.read_text()
                  )
              except Exception:
                  continue

              rows = (
                  data
                  if isinstance(data, list)
                  else (
                      data.get("rows")
                      if isinstance(data, dict)
                      else None
                  )
              )

              if (
                  rows
                  and isinstance(rows, list)
                  and isinstance(
                      rows[0],
                      list
                  )
              ):

                  h = [
                      str(x or "").strip()
                      or f"column_{i}"
                      for i, x
                      in enumerate(rows[0])
                  ]

                  objs = [
                      {
                          h[i]: (
                              r[i]
                              if i < len(r)
                              else None
                          )
                          for i
                          in range(len(h))
                      }
                      for r
                      in rows[1:]
                      if isinstance(r, list)
                  ]

                  tmp = p.with_suffix(
                      ".json.tmp"
                  )

                  tmp.write_text(
                      json.dumps(
                          objs,
                          ensure_ascii=False
                      )
                  )

                  os.replace(
                      tmp,
                      p
                  )
          PY

      - name: Resolve retry shard
        env:
          JSON_DIR: json
          CITIES_CSV: us-cities.csv
          ZIP_FILE: zip-code-to-usa-city-stat.txt
          OUTPUT: out/results.jsonl
          DIAGNOSTICS: out/diagnostics.jsonl
          CHECKPOINT: out/checkpoint.json
          NODE_OPTIONS: --max-old-space-size=12000
        run: node resolver

