                  for (
                      lineno,
                      raw,
                      exc
                  ) in malformed:

                      f.write(
                          (
                              f"LINE {lineno}\n"
                              f"ERROR: "
                              f"{type(exc).__name__}: "
                              f"{exc}\n"
                              f"BYTES: "
                              f"{len(raw)}\n"
                              f"CONTENT:\n"
                          ).encode()
                      )

                      f.write(
                          raw[:10000]
                      )

                      if not raw.endswith(
