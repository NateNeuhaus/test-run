name: Resolve Cities

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run validation first; use full only after validation passes"
        required: true
        default: validate
        type: choice
        options: [validate, full, retry]
      retry_source_run:
        description: "Previous full run ID whose successful artifacts should be reused"
        required: false
        default: "33759387965"
        type: string

permissions:
  contents: read

env:
  RELEASE_BASE: https://github.com/NateNeuhaus/test-run/releases/download/city-data-v1

jobs:
  validate:
    if: ${{ inputs.mode == 'validate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        chunk: ["00", "05", "10", "15"]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        run: |
          set -euo pipefail
          cp map-name-to-city-fixed resolver
          python3 - <<'PY'
          from pathlib import Path
          p=Path("resolver"); s=p.read_text()
          replacements={
            '"/home/ideapad/Documents/Files/temp/count/clean-up/json"':'process.env.JSON_DIR',
            '"/home/ideapad/Documents/Files/temp/us-cities.csv"':'process.env.CITIES_CSV',
            '"/home/ideapad/Documents/Files/temp/zip-code-to-usa-city-stat.txt"':'process.env.ZIP_FILE',
            '"/home/ideapad/Documents/Files/temp/count/name-to-city-resolved.jsonl"':'process.env.OUTPUT',
            '"/home/ideapad/Documents/Files/temp/count/name-to-city-resolved-diagnostics.jsonl"':'process.env.DIAGNOSTICS',
            '"/home/ideapad/Documents/Files/temp/count/name-to-city-resolved-checkpoint.json"':'process.env.CHECKPOINT'
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s)
          PY
          node --check resolver
          mkdir -p json out

      - name: Download and decrypt
        env:
          CITY_DATA_KEY: ${{ secrets.CITY_DATA_KEY }}
        run: |
          set -euo pipefail
          test -n "$CITY_DATA_KEY"
          curl -fL --retry 5 "$RELEASE_BASE/city-data-${{ matrix.chunk }}.tar.gz.enc" -o chunk.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -in chunk.enc -out chunk.tar.gz -pass env:CITY_DATA_KEY
          tar -xzf chunk.tar.gz -C json
          rm chunk.enc chunk.tar.gz

      - name: Normalize matrix sources and make sample
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,os,random
          root=pathlib.Path("json")
          for p in root.glob("*.json"):
              try: data=json.loads(p.read_text())
              except Exception: continue
              rows=data if isinstance(data,list) else (data.get("rows") if isinstance(data,dict) else None)
              if rows and isinstance(rows,list) and isinstance(rows[0],list):
                  h=[str(x or "").strip() or f"column_{i}" for i,x in enumerate(rows[0])]
                  objs=[{h[i]:(r[i] if i<len(r) else None) for i in range(len(h))}
                        for r in rows[1:] if isinstance(r,list)]
                  tmp=p.with_suffix(".json.tmp"); tmp.write_text(json.dumps(objs,ensure_ascii=False)); os.replace(tmp,p)

          random.seed(20260903)
          dst=pathlib.Path("sample"); dst.mkdir()
          files=list(root.glob("*.json")); random.shuffle(files)
          total=0
          for p in files[:25]:
              try: data=json.loads(p.read_text())
              except Exception: continue
              rows=data if isinstance(data,list) else (list(data.values()) if isinstance(data,dict) else [])
              rows=[r for r in rows if isinstance(r,dict)]
              if not rows: continue
              take=random.sample(rows,min(100,len(rows)))
              (dst/p.name).write_text(json.dumps(take,ensure_ascii=False))
              total+=len(take)
          print("Validation rows:",total)
          PY

      - name: Resolve validation sample
        env:
          JSON_DIR: sample
          CITIES_CSV: us-cities.csv
          ZIP_FILE: zip-code-to-usa-city-stat.txt
          OUTPUT: out/results.jsonl
          DIAGNOSTICS: out/diagnostics.jsonl
          CHECKPOINT: out/checkpoint.json
          NODE_OPTIONS: --max-old-space-size=12000
        run: node resolver

      - name: Check output
        run: |
          python3 - <<'PY'
          import json,re,pathlib,collections
          p=pathlib.Path("out/results.jsonl")
          rows=[json.loads(x) for x in p.read_text().splitlines() if x.strip()] if p.exists() else []
          counts=collections.Counter(r.get("status") for r in rows)
          bad=[r for r in rows if r.get("city") and re.search(r"\d",str(r["city"]))]
          print("Rows:",len(rows))
          print("Status:",dict(counts))
          print("Malformed city values:",len(bad))
          for r in bad[:20]: print(json.dumps(r,ensure_ascii=False))
          if bad: raise SystemExit("FAILED: malformed city values emitted")
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: validation-${{ matrix.chunk }}
          path: out/
          retention-days: 7

  full:
    if: ${{ inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        chunk: ["00","01","02","03","04","05","06","07","08","09","10","11","12","13","14","15"]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        run: |
          set -euo pipefail
          cp map-name-to-city-fixed resolver
          python3 - <<'PY'
          from pathlib import Path
          p=Path("resolver"); s=p.read_text()
          replacements={
            '"/home/ideapad/Documents/Files/temp/count/clean-up/json"':'process.env.JSON_DIR',
            '"/home/ideapad/Documents/Files/temp/us-cities.csv"':'process.env.CITIES_CSV',
            '"/home/ideapad/Documents/Files/temp/zip-code-to-usa-city-stat.txt"':'process.env.ZIP_FILE',
            '"/home/ideapad/Documents/Files/temp/count/name-to-city-resolved.jsonl"':'process.env.OUTPUT',
            '"/home/ideapad/Documents/Files/temp/count/name-to-city-resolved-diagnostics.jsonl"':'process.env.DIAGNOSTICS',
            '"/home/ideapad/Documents/Files/temp/count/name-to-city-resolved-checkpoint.json"':'process.env.CHECKPOINT'
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s)
          PY
          node --check resolver
          mkdir -p json out

      - name: Download and decrypt
        env:
          CITY_DATA_KEY: ${{ secrets.CITY_DATA_KEY }}
        run: |
          set -euo pipefail
          curl -fL --retry 5 "$RELEASE_BASE/city-data-${{ matrix.chunk }}.tar.gz.enc" -o chunk.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -in chunk.enc -out chunk.tar.gz -pass env:CITY_DATA_KEY
          tar -xzf chunk.tar.gz -C json
          rm chunk.enc chunk.tar.gz

      - name: Normalize matrix sources
        run: |
          python3 - <<'PY'
          import json,pathlib,os
          for p in pathlib.Path("json").glob("*.json"):
              try: data=json.loads(p.read_text())
              except Exception: continue
              rows=data if isinstance(data,list) else (data.get("rows") if isinstance(data,dict) else None)
              if rows and isinstance(rows,list) and isinstance(rows[0],list):
                  h=[str(x or "").strip() or f"column_{i}" for i,x in enumerate(rows[0])]
                  objs=[{h[i]:(r[i] if i<len(r) else None) for i in range(len(h))}
                        for r in rows[1:] if isinstance(r,list)]
                  tmp=p.with_suffix(".json.tmp"); tmp.write_text(json.dumps(objs,ensure_ascii=False)); os.replace(tmp,p)
          PY

      - name: Resolve
        env:
          JSON_DIR: json
          CITIES_CSV: us-cities.csv
          ZIP_FILE: zip-code-to-usa-city-stat.txt
          OUTPUT: out/results.jsonl
          DIAGNOSTICS: out/diagnostics.jsonl
          CHECKPOINT: out/checkpoint.json
          NODE_OPTIONS: --max-old-space-size=12000
        run: node resolver

      - name: Validate and repair output
        run: |
          python3 - <<'PY'
          import json,re,pathlib,os
          p=pathlib.Path("out/results.jsonl")
          if not p.exists():
              raise SystemExit("FAILED: out/results.jsonl does not exist")

          good=[]
          malformed=[]
          bad_city=[]

          with p.open("rb") as f:
              for lineno,raw in enumerate(f,1):
                  if not raw.strip():
                      continue
                  try:
                      r=json.loads(raw.decode("utf-8"))
                  except Exception as exc:
                      malformed.append((lineno,raw,exc))
                      continue

                  if not raw.endswith(b"\n"):
                      raw += b"\n"
                  good.append(raw)

                  if r.get("city") and re.search(r"\d",str(r["city"])):
                      bad_city.append(r)

          print("Valid JSONL records:",len(good))
          print("Malformed JSON records:",len(malformed))
          print("Malformed city values:",len(bad_city))

          if malformed:
              q=pathlib.Path("out/malformed-jsonl-records.txt")
              with q.open("wb") as f:
                  for lineno,raw,exc in malformed:
                      f.write(
                          f"LINE {lineno}\nERROR: {type(exc).__name__}: {exc}\nBYTES: {len(raw)}\nCONTENT:\n"
                          .encode("utf-8")
                      )
                      f.write(raw[:10000])
                      if not raw.endswith(b"\n"):
                          f.write(b"\n")
                      f.write(b"\n------------------------\n\n")

              tmp=pathlib.Path("out/results.jsonl.repaired.tmp")
              with tmp.open("wb") as f:
                  for raw in good:
                      f.write(raw)
                  f.flush()
                  os.fsync(f.fileno())
              os.replace(tmp,p)
              print("Repaired results.jsonl; corrupt records quarantined:",len(malformed))

          if bad_city:
              for r in bad_city[:20]:
                  print(json.dumps(r,ensure_ascii=False))
              raise SystemExit("FAILED: malformed city values emitted")

          print("Output usable.")
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: city-results-${{ matrix.chunk }}
          path: out/
          retention-days: 7


  retry:
    if: ${{ inputs.mode == 'retry' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        chunk: ["00","04","08","10","14"]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        run: |
          set -euo pipefail
          cp map-name-to-city-fixed resolver
          python3 - <<'PY'
          from pathlib import Path
          p=Path("resolver"); s=p.read_text()
          replacements={
            '"/home/ideapad/Documents/Files/temp/count/clean-up/json"':'process.env.JSON_DIR',
            '"/home/ideapad/Documents/Files/temp/us-cities.csv"':'process.env.CITIES_CSV',
            '"/home/ideapad/Documents/Files/temp/zip-code-to-usa-city-stat.txt"':'process.env.ZIP_FILE',
            '"/home/ideapad/Documents/Files/temp/count/name-to-city-resolved.jsonl"':'process.env.OUTPUT',
            '"/home/ideapad/Documents/Files/temp/count/name-to-city-resolved-diagnostics.jsonl"':'process.env.DIAGNOSTICS',
            '"/home/ideapad/Documents/Files/temp/count/name-to-city-resolved-checkpoint.json"':'process.env.CHECKPOINT'
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s)
          PY
          node --check resolver
          mkdir -p json out

      - name: Download and decrypt
        env:
          CITY_DATA_KEY: ${{ secrets.CITY_DATA_KEY }}
        run: |
          set -euo pipefail
          test -n "$CITY_DATA_KEY"
          curl -fL --retry 5 "$RELEASE_BASE/city-data-${{ matrix.chunk }}.tar.gz.enc" -o chunk.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -in chunk.enc -out chunk.tar.gz -pass env:CITY_DATA_KEY
          tar -xzf chunk.tar.gz -C json
          rm chunk.enc chunk.tar.gz

      - name: Normalize matrix sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,os
          for p in pathlib.Path("json").glob("*.json"):
              try: data=json.loads(p.read_text())
              except Exception: continue
              rows=data if isinstance(data,list) else (data.get("rows") if isinstance(data,dict) else None)
              if rows and isinstance(rows,list) and isinstance(rows[0],list):
                  h=[str(x or "").strip() or f"column_{i}" for i,x in enumerate(rows[0])]
                  objs=[{h[i]:(r[i] if i<len(r) else None) for i in range(len(h))}
                        for r in rows[1:] if isinstance(r,list)]
                  tmp=p.with_suffix(".json.tmp")
                  tmp.write_text(json.dumps(objs,ensure_ascii=False))
                  os.replace(tmp,p)
          PY

      - name: Resolve retry shard
        env:
          JSON_DIR: json
          CITIES_CSV: us-cities.csv
          ZIP_FILE: zip-code-to-usa-city-stat.txt
          OUTPUT: out/results.jsonl
          DIAGNOSTICS: out/diagnostics.jsonl
          CHECKPOINT: out/checkpoint.json
          NODE_OPTIONS: --max-old-space-size=12000
        run: node resolver

      - name: Validate and repair output
        run: |
          python3 - <<'PY'
          import json,re,pathlib,os
          p=pathlib.Path("out/results.jsonl")
          if not p.exists():
              raise SystemExit("FAILED: out/results.jsonl does not exist")
          good=[]; malformed=[]; bad_city=[]
          with p.open("rb") as f:
              for lineno,raw in enumerate(f,1):
                  if not raw.strip(): continue
                  try:
                      r=json.loads(raw.decode("utf-8"))
                  except Exception as exc:
                      malformed.append((lineno,raw,exc))
                      continue
                  if not raw.endswith(b"\n"): raw += b"\n"
                  good.append(raw)
                  if r.get("city") and re.search(r"\d",str(r["city"])):
                      bad_city.append(r)

          print("Valid JSONL records:",len(good))
          print("Malformed JSON records:",len(malformed))
          print("Malformed city values:",len(bad_city))

          if malformed:
              q=pathlib.Path("out/malformed-jsonl-records.txt")
              with q.open("wb") as f:
                  for lineno,raw,exc in malformed:
                      f.write(f"LINE {lineno}\nERROR: {type(exc).__name__}: {exc}\nBYTES: {len(raw)}\nCONTENT:\n".encode())
                      f.write(raw[:10000])
                      if not raw.endswith(b"\n"): f.write(b"\n")
                      f.write(b"\n------------------------\n\n")
              tmp=pathlib.Path("out/results.jsonl.repaired.tmp")
              with tmp.open("wb") as f:
                  for raw in good: f.write(raw)
                  f.flush(); os.fsync(f.fileno())
              os.replace(tmp,p)
              print("Repaired results.jsonl; quarantined:",len(malformed))

          if bad_city:
              for r in bad_city[:20]: print(json.dumps(r,ensure_ascii=False))
              raise SystemExit("FAILED: malformed city values emitted")
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: city-results-${{ matrix.chunk }}
          path: out/
          retention-days: 7

  merge:
    if: ${{ always() && (inputs.mode == 'full' || inputs.mode == 'retry') }}
    needs: [full, retry]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download current-run shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: city-results-*
          path: shards/current
          merge-multiple: false

      - name: Reuse successful shards from previous run
        if: ${{ inputs.mode == 'retry' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.retry_source_run }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,urllib.request,zipfile,io

          repo=os.environ["REPOSITORY"]
          run=os.environ["SOURCE_RUN"]
          token=os.environ["GH_TOKEN"]
          wanted={"01","02","03","05","06","07","09","11","12","13","15"}

          api=f"https://api.github.com/repos/{repo}/actions/runs/{run}/artifacts?per_page=100"
          req=urllib.request.Request(
              api,
              headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
              },
          )
          with urllib.request.urlopen(req) as r:
              payload=json.load(r)

          by_name={a["name"]:a for a in payload.get("artifacts",[]) if not a.get("expired")}
          root=pathlib.Path("shards/previous")
          root.mkdir(parents=True,exist_ok=True)

          missing=[]
          for chunk in sorted(wanted):
              name=f"city-results-{chunk}"
              art=by_name.get(name)
              if not art:
                  missing.append(name)
                  continue

              req=urllib.request.Request(
                  art["archive_download_url"],
                  headers={
                      "Authorization":f"Bearer {token}",
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as r:
                  blob=r.read()

              dst=root/name
              dst.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(blob)) as z:
                  z.extractall(dst)
              print("Reused",name,"from run",run)

          if missing:
              raise SystemExit("Missing previous artifacts: "+", ".join(missing))
          PY

      - name: Verify all 16 shards exist
        run: |
          python3 - <<'PY'
          import pathlib
          found={}
          for p in pathlib.Path("shards").rglob("results.jsonl"):
              parent=p.parent.name
              if parent.startswith("city-results-"):
                  found[parent[-2:]]=str(p)
          expected={f"{i:02d}" for i in range(16)}
          missing=sorted(expected-set(found))
          print("Shards found:",sorted(found))
          if missing:
              raise SystemExit("Missing shards: "+", ".join(missing))
          PY

      - name: Merge resiliently
        run: |
          python3 - <<'PY'
          import json,pathlib,collections
          cities=collections.defaultdict(set)
          stats=collections.Counter()
          malformed=[]

          files=list(pathlib.Path("shards").rglob("results.jsonl"))
          for p in files:
              for lineno,line in enumerate(p.open(encoding="utf-8",errors="replace"),1):
                  if not line.strip(): continue
                  try:
                      r=json.loads(line)
                  except Exception as exc:
                      malformed.append({
                          "file":str(p),
                          "line":lineno,
                          "error":str(exc),
                          "content":line[:2000]
                      })
                      continue

                  stats[r.get("status","unknown")]+=1
                  if r.get("name") and r.get("city"):
                      cities[r["name"]].add(r["city"])

          final={}
          collisions={}
          for name,vals in cities.items():
              vals=sorted(vals)
              final[name]=vals[0] if len(vals)==1 else vals
              if len(vals)>1:
                  collisions[name]=vals

          pathlib.Path("name-to-city.json").write_text(
              json.dumps(final,ensure_ascii=False,indent=2)+"\n"
          )
          pathlib.Path("name-to-city-collisions.json").write_text(
              json.dumps(collisions,ensure_ascii=False,indent=2)+"\n"
          )
          pathlib.Path("merge-malformed-records.json").write_text(
              json.dumps(malformed,ensure_ascii=False,indent=2)+"\n"
          )

          summary={
              "status_counts":dict(stats),
              "unique_names":len(final),
              "name_collisions":len(collisions),
              "malformed_records_skipped":len(malformed),
              "shard_files":len(files)
          }
          pathlib.Path("merge-summary.json").write_text(
              json.dumps(summary,indent=2)+"\n"
          )
          print(json.dumps(summary,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: FINAL-name-to-city
          path: |
            name-to-city.json
            name-to-city-collisions.json
            merge-summary.json
            merge-malformed-records.json
          retention-days: 30
