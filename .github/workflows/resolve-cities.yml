name: Resolve Cities

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: validate
        type: choice
        options: [validate, full, retry, merge]

      retry_source_run:
        description: "Previous full run ID whose successful artifacts should be reused"
        required: false
        default: "33759387965"
        type: string

      retry_run_id:
        description: "Retry run ID containing successful retry artifacts (00,04,08,10,14)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

env:
  RELEASE_BASE: https://github.com/NateNeuhaus/test-run/releases/download/city-data-v1

jobs:

  # ============================================================
  # VALIDATION
  # ============================================================

  validate:
    if: ${{ inputs.mode == 'validate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        chunk: ["00", "05", "10", "15"]

    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        run: |
          set -euo pipefail

          cp map-name-to-city-fixed resolver

          python3 - <<'PY'
          from pathlib import Path

          p = Path("resolver")
          s = p.read_text()

          replacements = {
            '"/home/ideapad/Documents/Files/temp/count/clean-up/json"':
              'process.env.JSON_DIR',

            '"/home/ideapad/Documents/Files/temp/us-cities.csv"':
              'process.env.CITIES_CSV',

            '"/home/ideapad/Documents/Files/temp/zip-code-to-usa-city-stat.txt"':
              'process.env.ZIP_FILE',

            '"/home/ideapad/Documents/Files/temp/count/name-to-city-resolved.jsonl"':
              'process.env.OUTPUT',

            '"/home/ideapad/Documents/Files/temp/count/name-to-city-resolved-diagnostics.jsonl"':
              'process.env.DIAGNOSTICS',

            '"/home/ideapad/Documents/Files/temp/count/name-to-city-resolved-checkpoint.json"':
              'process.env.CHECKPOINT'
          }

          for a, b in replacements.items():
              s = s.replace(a, b)

          p.write_text(s)
          PY

          node --check resolver

          mkdir -p json out

      - name: Download and decrypt
        env:
          CITY_DATA_KEY: ${{ secrets.CITY_DATA_KEY }}
        run: |
          set -euo pipefail

          test -n "$CITY_DATA_KEY"

          curl -fL --retry 5 \
            "$RELEASE_BASE/city-data-${{ matrix.chunk }}.tar.gz.enc" \
            -o chunk.enc

          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -md sha256 \
            -in chunk.enc \
            -out chunk.tar.gz \
            -pass env:CITY_DATA_KEY

          tar -xzf chunk.tar.gz -C json

          rm chunk.enc chunk.tar.gz

      - name: Normalize matrix sources and make sample
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import pathlib
          import os
          import random

          root = pathlib.Path("json")

          for p in root.glob("*.json"):

              try:
                  data = json.loads(p.read_text())
              except Exception:
                  continue

              rows = (
                  data
                  if isinstance(data, list)
                  else (
                      data.get("rows")
                      if isinstance(data, dict)
                      else None
                  )
              )

              if (
                  rows
                  and isinstance(rows, list)
                  and isinstance(rows[0], list)
              ):

                  h = [
                      str(x or "").strip() or f"column_{i}"
                      for i, x in enumerate(rows[0])
                  ]

                  objs = [
                      {
                          h[i]: (
                              r[i]
                              if i < len(r)
                              else None
                          )
                          for i in range(len(h))
                      }
                      for r in rows[1:]
                      if isinstance(r, list)
                  ]

                  tmp = p.with_suffix(".json.tmp")

                  tmp.write_text(
                      json.dumps(
                          objs,
                          ensure_ascii=False
                      )
                  )

                  os.replace(tmp, p)

          random.seed(20260903)

          dst = pathlib.Path("sample")
          dst.mkdir()

          files = list(root.glob("*.json"))
          random.shuffle(files)

          total = 0

          for p in files[:25]:

              try:
                  data = json.loads(p.read_text())
              except Exception:
                  continue

              rows = (
                  data
                  if isinstance(data, list)
                  else (
                      list(data.values())
                      if isinstance(data, dict)
                      else []
                  )
              )

              rows = [
                  r
                  for r in rows
                  if isinstance(r, dict)
              ]

              if not rows:
                  continue

              take = random.sample(
                  rows,
                  min(100, len(rows))
              )

              (dst / p.name).write_text(
                  json.dumps(
                      take,
                      ensure_ascii=False
                  )
              )

              total += len(take)

          print("Validation rows:", total)
          PY

      - name: Resolve validation sample
        env:
          JSON_DIR: sample
          CITIES_CSV: us-cities.csv
          ZIP_FILE: zip-code-to-usa-city-stat.txt
          OUTPUT: out/results.jsonl
          DIAGNOSTICS: out/diagnostics.jsonl
          CHECKPOINT: out/checkpoint.json
          NODE_OPTIONS: --max-old-space-size=12000
        run: node resolver

      - name: Validate and repair validation output
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import re
          import pathlib
          import os
          import collections

          p = pathlib.Path("out/results.jsonl")

          if not p.exists():
              raise SystemExit(
                  "FAILED: out/results.jsonl does not exist"
              )

          good = []
          malformed = []
          bad_city = []
          counts = collections.Counter()

          with p.open("rb") as f:

              for lineno, raw in enumerate(f, 1):

                  if not raw.strip():
                      continue

                  try:

                      r = json.loads(
                          raw.decode("utf-8")
                      )

                  except Exception as exc:

                      malformed.append(
                          (
                              lineno,
                              raw,
                              exc
                          )
                      )

                      continue

                  if not raw.endswith(b"\n"):
                      raw += b"\n"

                  good.append(raw)

                  counts[
                      r.get("status", "unknown")
                  ] += 1

                  if (
                      r.get("city")
                      and re.search(
                          r"\d",
                          str(r["city"])
                      )
                  ):

                      bad_city.append(r)

          print(
              "Valid JSONL records:",
              len(good)
          )

          print(
              "Status:",
              dict(counts)
          )

          print(
              "Malformed JSON records:",
              len(malformed)
          )

          print(
              "Malformed city values:",
              len(bad_city)
          )

          if malformed:

              q = pathlib.Path(
                  "out/malformed-jsonl-records.txt"
              )

              with q.open("wb") as f:

                  for lineno, raw, exc in malformed:

                      f.write(
                          (
                              f"LINE {lineno}\n"
                              f"ERROR: "
                              f"{type(exc).__name__}: "
                              f"{exc}\n"
                              f"BYTES: {len(raw)}\n"
                              f"CONTENT:\n"
                          ).encode("utf-8")
                      )

                      f.write(raw[:10000])

                      if not raw.endswith(b"\n"):
                          f.write(b"\n")

                      f.write(
                          b"\n"
                          b"------------------------"
                          b"\n\n"
                      )

              tmp = pathlib.Path(
                  "out/results.jsonl.repaired.tmp"
              )

              with tmp.open("wb") as f:

                  for raw in good:
                      f.write(raw)

                  f.flush()
                  os.fsync(f.fileno())

              os.replace(tmp, p)

              print(
                  "Repaired results.jsonl; "
                  "corrupt records quarantined:",
                  len(malformed)
              )

          if bad_city:

              for r in bad_city[:20]:
                  print(
                      json.dumps(
                          r,
                          ensure_ascii=False
                      )
                  )

              raise SystemExit(
                  "FAILED: malformed city values emitted"
              )

          print("Validation output usable.")
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: validation-${{ matrix.chunk }}
          path: out/
          retention-days: 7


  # ============================================================
  # FULL
  # ============================================================

  full:
    if: ${{ inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 16

      matrix:
