  # ============================================================
  # MERGE
  #
  # MODE=full:
  #   merge the 16 artifacts produced by this run
  #
  # MODE=retry:
  #   merge 5 retry artifacts from this run +
  #   11 successful artifacts from old full run
  #
  # MODE=merge:
  #   DO NOT rerun any city resolution
  #   download 11 old full artifacts +
  #   5 already-successful retry artifacts
  # ============================================================

  merge:
    if: >-
      ${{
        always() &&
        (
          inputs.mode == 'full' ||
          inputs.mode == 'retry' ||
          inputs.mode == 'merge'
        )
      }}

    needs:
      - full
      - retry

    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:

      # --------------------------------------------------------
      # FULL MODE
      # --------------------------------------------------------

      - name: Download current full-run artifacts
        if: ${{ inputs.mode == 'full' }}
        uses: actions/download-artifact@v4
        with:
          pattern: city-results-*
          path: shards/full
          merge-multiple: false


      # --------------------------------------------------------
      # RETRY MODE
      # --------------------------------------------------------

      - name: Download current retry artifacts
        if: ${{ inputs.mode == 'retry' }}
        uses: actions/download-artifact@v4
        with:
          pattern: city-results-*
          path: shards/retry
          merge-multiple: false


      # --------------------------------------------------------
      # PREVIOUS FULL RUN
      #
      # Native GitHub cross-run artifact download.
      # No urllib.
      # No manual redirect handling.
      # --------------------------------------------------------

      - name: Download successful artifacts from previous full run
        if: >-
          ${{
            inputs.mode == 'retry' ||
            inputs.mode == 'merge'
          }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.retry_source_run }}
          pattern: city-results-*
          path: shards/previous-full
          merge-multiple: false


      # --------------------------------------------------------
      # EXISTING RETRY RUN
      #
      # Used by MODE=merge.
      # This avoids rerunning 00,04,08,10,14.
      # --------------------------------------------------------

      - name: Download completed artifacts from retry run
        if: ${{ inputs.mode == 'merge' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.retry_run_id }}
          pattern: city-results-*
          path: shards/retry
          merge-multiple: false


      # --------------------------------------------------------
      # SELECT EXACTLY THE CORRECT 16
      #
      # Retry shards override failed old-full shards.
      # --------------------------------------------------------

      - name: Select exactly one artifact for each shard
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib
          import shutil

          mode = "${{ inputs.mode }}"

          root = pathlib.Path(
              "shards"
          )

          selected = pathlib.Path(
              "selected-shards"
          )

          selected.mkdir(
              parents=True,
              exist_ok=True
          )

          expected = {
              f"{i:02d}"
              for i in range(16)
          }

          retry_chunks = {
              "00",
              "04",
              "08",
              "10",
              "14"
          }

          def result(
              base,
              chunk
          ):

              p = (
                  base
                  / f"city-results-{chunk}"
                  / "results.jsonl"
              )

              return (
                  p
                  if p.exists()
                  else None
              )

          for chunk in sorted(expected):

              if mode == "full":

                  p = result(
                      root / "full",
                      chunk
                  )

                  source = "full"

              elif chunk in retry_chunks:

                  p = result(
                      root / "retry",
                      chunk
                  )

                  source = "retry"

              else:

                  p = result(
                      root / "previous-full",
                      chunk
                  )

                  source = "previous-full"

              if not p:

                  raise SystemExit(
                      "FAILED: missing selected "
                      f"shard {chunk} "
                      f"from {source}"
                  )

              dst = (
                  selected
                  / f"city-results-{chunk}"
              )

              shutil.copytree(
                  p.parent,
                  dst,
                  dirs_exist_ok=True
              )

              print(
                  chunk,
                  "<-",
                  source,
                  p
              )
          PY


      # --------------------------------------------------------
      # VERIFY ALL 16
      # --------------------------------------------------------

      - name: Verify all 16 selected shards
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib

          root = pathlib.Path(
              "selected-shards"
          )

          missing = []

          for i in range(16):

              chunk = f"{i:02d}"

              p = (
                  root
                  / f"city-results-{chunk}"
                  / "results.jsonl"
              )

              if (
                  not p.exists()
                  or p.stat().st_size == 0
              ):

                  missing.append(
                      chunk
                  )

                  print(
                      chunk,
                      "MISSING OR EMPTY"
                  )

              else:

                  print(
                      chunk,
                      p.stat().st_size,
                      "bytes"
                  )

          if missing:

              raise SystemExit(
                  "FAILED: missing/empty "
                  "shards: "
                  + ", ".join(missing)
              )

          print(
              "All 16 selected shards "
              "are present and non-empty."
          )
          PY


      # --------------------------------------------------------
      # MERGE
      # --------------------------------------------------------

      - name: Merge resiliently
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import pathlib
          import collections

          cities = collections.defaultdict(
              set
          )

          stats = collections.Counter()

          malformed = []

          shard_counts = {}

          files = sorted(
              pathlib.Path(
                  "selected-shards"
              ).glob(
                  "city-results-*/"
                  "results.jsonl"
              )
          )

          if len(files) != 16:

              raise SystemExit(
                  "FAILED: expected "
                  "16 result files, "
                  f"found {len(files)}"
              )

          for p in files:

              chunk = p.parent.name[-2:]

              count = 0

              with p.open(
                  encoding="utf-8",
                  errors="replace"
              ) as f:

                  for lineno, line in enumerate(
                      f,
                      1
                  ):

                      if not line.strip():
                          continue

                      try:

                          r = json.loads(
                              line
                          )

                      except Exception as exc:

                          malformed.append(
                              {
                                  "chunk": chunk,
                                  "file": str(p),
                                  "line": lineno,
                                  "error": str(exc),
                                  "content":
                                      line[:2000]
                              }
                          )

                          continue

                      count += 1

                      stats[
                          r.get(
                              "status",
                              "unknown"
                          )
                      ] += 1

                      if (
                          r.get("name")
                          and r.get("city")
                      ):

                          cities[
                              r["name"]
                          ].add(
                              r["city"]
                          )

              shard_counts[
                  chunk
              ] = count

          final = {}

          collisions = {}

          for name, vals in cities.items():

              vals = sorted(vals)

              final[name] = (
                  vals[0]
                  if len(vals) == 1
                  else vals
              )

              if len(vals) > 1:

                  collisions[
                      name
                  ] = vals

          pathlib.Path(
              "name-to-city.json"
          ).write_text(
              json.dumps(
                  final,
                  ensure_ascii=False,
                  indent=2
              )
              + "\n"
          )

          pathlib.Path(
              "name-to-city-collisions.json"
          ).write_text(
              json.dumps(
                  collisions,
                  ensure_ascii=False,
                  indent=2
              )
              + "\n"
          )

          pathlib.Path(
              "merge-malformed-records.json"
          ).write_text(
              json.dumps(
                  malformed,
                  ensure_ascii=False,
                  indent=2
              )
              + "\n"
          )

          summary = {

              "status_counts":
                  dict(stats),

              "unique_names":
                  len(final),

              "name_collisions":
                  len(collisions),

              "malformed_records_skipped":
                  len(malformed),

              "shard_files":
                  len(files),

              "records_per_shard":
                  dict(
                      sorted(
                          shard_counts.items()
                      )
                  )
          }

          pathlib.Path(
              "merge-summary.json"
          ).write_text(
              json.dumps(
                  summary,
                  indent=2
              )
              + "\n"
          )

          print(
              json.dumps(
                  summary,
                  indent=2
              )
          )
          PY


      # --------------------------------------------------------
      # FINAL RESULT
      # --------------------------------------------------------

      - uses: actions/upload-artifact@v4
        with:
          name: FINAL-name-to-city
          path: |
            name-to-city.json
            name-to-city-collisions.json
            merge-summary.json
            merge-malformed-records.json
          retention-days: 30
